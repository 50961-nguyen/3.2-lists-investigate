name: Autograding Tests

on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Correct output
        id: correct-output
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Correct output
          setup-command: ""
          command: pytest test_list_investigate.py::test_correct_output
          timeout: 5
          max-score: 1

      - name: square_numbers() return value
        id: square-numbers-return
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: square_numbers() return value
          setup-command: ""
          command: pytest test_list_investigate.py::test_square_numbers_return
          timeout: 5
          max-score: 1

      - name: Header comments
        id: header-comments
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Header comments
          setup-command: ""
          command: pytest test_list_investigate.py::test_header_comments
          timeout: 5
          max-score: 1

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          CORRECT-OUTPUT_RESULTS: "${{steps.correct-output.outputs.result}}"
          SQUARE-NUMBERS-RETURN_RESULTS: "${{steps.square-numbers-return.outputs.result}}"
          HEADER-COMMENTS_RESULTS: "${{steps.header-comments.outputs.result}}"
        with:
          runners: correct-output,square-numbers-return,header-comments
